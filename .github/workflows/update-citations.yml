name: Update citation counts

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays around 10:17 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-citation-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh citation counts
        id: refresh
        continue-on-error: true
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python3 bin/update_semantic_scholar_citations.py
      - name: Save successful updates
        run: |
          if [ -f _data/semantic_scholar_citations.json ]; then
            git add _data/semantic_scholar_citations.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update Semantic Scholar citation counts"
              git pull --rebase origin "$DEFAULT_BRANCH"
              git push origin "HEAD:$DEFAULT_BRANCH"
            fi
          fi
      - name: Deploy cached citation counts
        # GITHUB_TOKEN pushes do not trigger the deploy workflow; dispatch it
        # explicitly. This also retries deployment after a previous failure.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f _data/semantic_scholar_citations.json ]; then
            gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
          fi
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Some citation counts could not be refreshed. Previous values were retained."
          exit 1
