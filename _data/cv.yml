  summary: Jointly trained Ph.D. student at Jilin University and Zhongguancun Academy, currently based at Zhongguancun Academy. I work closely with Prof. Chaoyu at Zhongguancun Academy on embodied intelligence, and I am also advised by Prof. Yuanbo Xu at Jilin University. My research focuses on embodied intelligence, especially learning from human egocentric videos and latent dynamics for robot agents. My goal is to build data-efficient embodied agents that learn from human experience, understand physical dynamics, and generalize to real-world tasks. My previous work explored generative models, time-series modeling, and data mining.

